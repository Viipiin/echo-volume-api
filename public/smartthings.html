<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Connect SmartThings</title>
<link rel="icon" href="/app-icon.png">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/ui.css">
<link rel="stylesheet" href="/st-connect.css">
</head>
<body>
<div class="bgfx" aria-hidden="true"><i></i><i></i><i></i></div>
<main class="card st">
  <div class="st-head">
    <span class="st-ico"><svg class="i lg" aria-hidden="true"><use href="/icons.svg#tv"/></svg></span>
    <div><h1>Connect SmartThings</h1><p class="muted" id="intro">Checking…</p></div>
  </div>
  <div id="steps" hidden>
    <ol class="st-steps">
      <li>Click <b>Open SmartThings sign-in</b>, sign in with your Samsung account and approve access.</li>
      <li>You'll land on an <code>httpbin.org</code> page showing JSON. Copy the whole page (or its address bar) and paste it below.</li>
      <li>Click <b>Connect</b>.</li>
    </ol>
    <p><button type="button" class="btn primary" id="open">Open SmartThings sign-in</button></p>
    <textarea class="input" id="paste" aria-label="Sign-in result" placeholder='Paste the httpbin page or URL here (contains "code")'></textarea>
    <button type="button" class="btn primary" id="connect">Connect</button>
  </div>
  <div class="status" id="status" role="status"></div>
  <p><a href="/" class="st-back"><svg class="i sm" aria-hidden="true"><use href="/icons.svg#chevron-left"/></svg>Back to Echo Volume</a></p>
</main>
<script src="/ui.js"></script>
<script src="/st-connect.js"></script>
</body>
</html>
