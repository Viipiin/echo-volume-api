<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Connect SmartThings</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f4f6f9; --card:#fff; --line:#e3e7ee; --text:#151a22; --muted:#6b7584; --accent:#0e8fb8; --danger:#c2412d; --ok:#1f9d55; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0f1115; --card:#181b22; --line:#272b35; --text:#e9ecf1; --muted:#8a93a3; --accent:#3ec6e0; --danger:#f0785f; --ok:#4ccb83; }
  }
  :root[data-theme="dark"] { --bg:#0f1115; --card:#181b22; --line:#272b35; --text:#e9ecf1; --muted:#8a93a3; --accent:#3ec6e0; --danger:#f0785f; --ok:#4ccb83; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:Inter, system-ui, sans-serif; padding:24px 16px; }
  .card { max-width:560px; margin:0 auto; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px; }
  h1 { font-size:20px; margin:0 0 6px; }
  p, li { color:var(--muted); font-size:14px; line-height:1.55; }
  ol { padding-left:20px; }
  code { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:1px 6px; font-size:13px; color:var(--text); }
  button, .btn { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:10px 18px; font:inherit; font-weight:600; cursor:pointer; text-decoration:none; display:inline-block; }
  textarea { width:100%; min-height:90px; background:transparent; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px; font:13px ui-monospace, monospace; margin:8px 0 12px; }
  .status { margin-top:14px; font-size:14px; min-height:20px; }
  .status.ok { color:var(--ok); } .status.err { color:var(--danger); }
  a { color:var(--accent); }
</style>
</head>
<body>
<div class="card">
  <h1>Connect SmartThings</h1>
  <p id="intro">Checking…</p>
  <div id="steps" hidden>
    <ol>
      <li>Click <b>Open SmartThings sign-in</b>, sign in with your Samsung account and approve access.</li>
      <li>You'll land on an <code>httpbin.org</code> page showing JSON. Copy the whole page (or its address bar) and paste it below.</li>
      <li>Click <b>Connect</b>.</li>
    </ol>
    <p><button id="open">Open SmartThings sign-in</button></p>
    <textarea id="paste" placeholder='Paste the httpbin page or URL here (contains "code")'></textarea>
    <button id="connect">Connect</button>
  </div>
  <div class="status" id="status"></div>
  <p><a href="/">← Back to Echo Volume</a></p>
</div>
<script>
const $ = (id) => document.getElementById(id);
const key = new URLSearchParams(location.search).get('key') || '';
const api = (url, body) => fetch('/api/st' + url, {
  method: body ? 'POST' : 'GET',
  headers: { 'Content-Type': 'application/json', ...(key && { 'x-api-key': key }) },
  body: body && JSON.stringify(body),
}).then(async (r) => { const j = await r.json(); if (!r.ok) throw new Error(j.error); return j; });
const status = (t, cls) => { $('status').textContent = t; $('status').className = 'status ' + (cls || ''); };
// Same theme as the main page (saved on the server)
fetch('/api/ui', { headers: key ? { 'x-api-key': key } : {} }).then((r) => r.json())
  .then((s) => { if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme; }).catch(() => {});

// Accepts the httpbin JSON, the redirect URL, or the bare code
function extract(text) {
  text = text.trim();
  try { const j = JSON.parse(text); if (j.args?.code) return { code: j.args.code, state: j.args.state }; } catch {}
  const m = text.match(/[?&"]code"?\s*[=:]\s*"?([A-Za-z0-9_-]+)/);
  const s = text.match(/[?&"]state"?\s*[=:]\s*"?([A-Za-z0-9_-]+)/);
  if (m) return { code: m[1], state: s?.[1] };
  return /^[A-Za-z0-9_-]{4,}$/.test(text) ? { code: text } : null;
}

async function init() {
  try {
    const s = await api('/auth/status');
    if (!s.configured) { $('intro').innerHTML = 'Not configured yet: set <code>ST_CLIENT_ID</code> and <code>ST_CLIENT_SECRET</code> in <code>.env</code>, then restart the server.'; return; }
    $('intro').textContent = s.connected ? 'SmartThings is connected. You can reconnect below if needed.' : 'Sign in once; the server keeps itself signed in after that.';
    if (s.connected) status('Connected ✓', 'ok');
    $('steps').hidden = false;
    if (/Electron/.test(navigator.userAgent)) {
      // Desktop app: the sign-in window captures the code itself
      $('steps').querySelector('ol').innerHTML = '<li>Click <b>Open SmartThings sign-in</b>, sign in with your Samsung account and approve access.</li><li>The window closes and connects automatically.</li>';
      $('paste').hidden = true; $('connect').hidden = true;
    }
  } catch (e) { $('intro').textContent = e.message; }
}

$('open').onclick = async () => {
  try { window.open((await api('/auth/url')).url, '_blank', 'noopener'); status('Approve access in the new tab, then paste the result here.'); }
  catch (e) { status(e.message, 'err'); }
};
$('connect').onclick = async () => {
  const got = extract($('paste').value);
  if (!got) return status('Could not find a code in what you pasted.', 'err');
  status('Connecting…');
  try { await api('/auth/code', got); status('Connected ✓ — you can go back to Echo Volume.', 'ok'); $('paste').value = ''; }
  catch (e) { status(e.message, 'err'); }
};
init();
</script>
</body>
</html>
