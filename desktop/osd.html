<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Echo Volume indicator</title>
<style>
  html, body { margin:0; height:100%; background:transparent; overflow:hidden; font-family:"Segoe UI Variable", "Segoe UI", system-ui, sans-serif; }
  .box { box-sizing:border-box; height:100%; border-radius:14px; padding:12px 16px; display:flex; flex-direction:column; justify-content:center; gap:8px;
         background:rgba(255,255,255,.96); color:#151a22; border:1px solid rgba(0,0,0,.08); }
  .dark .box { background:rgba(24,27,34,.96); color:#e9ecf1; border-color:rgba(255,255,255,.08); }
  .row { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .title { font-size:13px; opacity:.75; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .value { font-size:18px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .bar { height:6px; border-radius:3px; background:rgba(127,127,127,.25); overflow:hidden; }
  .fill { height:100%; width:0; border-radius:3px; background:#0e8fb8; transition:width .12s; }
  .dark .fill { background:#3ec6e0; }
</style>
</head>
<body>
<div class="box">
  <div class="row"><span class="title" id="t"></span><span class="value" id="v"></span></div>
  <div class="bar"><div class="fill" id="f"></div></div>
</div>
<script>
  function show(title, value, frac, dark) {
    document.documentElement.classList.toggle('dark', !!dark);
    document.getElementById('t').textContent = title;
    document.getElementById('v').textContent = value;
    document.getElementById('f').style.width = Math.max(0, Math.min(1, frac)) * 100 + '%';
  }
</script>
</body>
</html>
