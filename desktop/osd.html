<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Echo Volume indicator</title>
<!-- Loaded from disk (no server), so the colours are copied from public/theme.css: keep them in step.
     show(title, value, fraction, theme) is called by desktop/main.js; theme = light | dark | midnight. -->
<style>
  :root { --bg: rgba(255, 255, 255, 0.97); --text: #0f1726; --muted: #5b667a; --line: rgba(15, 23, 42, 0.1); --track: rgba(15, 23, 42, 0.1);
    --accent: #0a7ea8; --accent-2: #2cc3f0; --glow: rgba(10, 126, 168, 0.45); }
  .dark { --bg: rgba(22, 27, 35, 0.97); --text: #e9ecf1; --muted: #9aa3b2; --line: rgba(255, 255, 255, 0.1); --track: rgba(255, 255, 255, 0.1);
    --accent: #2cc3f0; --accent-2: #7be3ff; --glow: rgba(44, 195, 240, 0.55); }
  .midnight { --bg: rgba(15, 21, 38, 0.97); --text: #e8edf7; --muted: #9aa6bd; --line: rgba(255, 255, 255, 0.1); --track: rgba(255, 255, 255, 0.1);
    --accent: #2cc3f0; --accent-2: #7be3ff; --glow: rgba(44, 195, 240, 0.65); }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .box { box-sizing: border-box; height: 100%; border-radius: 14px; padding: 12px 16px; display: flex; flex-direction: column; justify-content: center; gap: 8px;
    background: var(--bg); color: var(--text); border: 1px solid var(--line); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .title { flex: 0 1 auto; min-width: 48px; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .value { font: 650 18px "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .value.long { font-size: 13px; font-weight: 600; } /* messages (errors) rather than a level */
  .bar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, var(--accent-2), var(--accent)); box-shadow: 0 0 10px var(--glow); transition: width 120ms cubic-bezier(0.22, 1, 0.36, 1); }
  @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>
</head>
<body>
<div class="box">
  <div class="row"><span class="title" id="t"></span><span class="value" id="v"></span></div>
  <div class="bar"><div class="fill" id="f"></div></div>
</div>
<script>
  function show(title, value, frac, theme) {
    const root = document.documentElement;
    root.classList.toggle('dark', theme === 'dark');
    root.classList.toggle('midnight', theme === 'midnight');
    document.getElementById('t').textContent = title;
    const v = document.getElementById('v');
    v.textContent = value;
    v.classList.toggle('long', String(value).length > 14);
    document.getElementById('f').style.width = Math.max(0, Math.min(1, frac)) * 100 + '%';
  }
</script>
</body>
</html>
